slam_toolbox:
  ros__parameters:

    # Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_link

    # Laser
    scan_topic: /scan

    # SLAM mode
    mode: mapping

    # Simulation
    use_sim_time: true

    # Map
    resolution: 0.05
    map_update_interval: 2.0

    # Laser limits
    min_laser_range: 0.12
    max_laser_range: 10.0 # 3.5

    # Scan processing
    throttle_scans: 1
    minimum_time_interval: 0.0 # 0.5

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: true

    # Motion thresholds
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1

    # Loop closure
    do_loop_closing: false

    # TF
    transform_publish_period: 0.02
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
